<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Slim dark scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 9999px; }
        ::-webkit-scrollbar-track { background: transparent; }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fade-up .2s ease-out; }
    </style>
</head>

<body class="min-h-screen bg-neutral-900 text-white antialiased">

    <!-- Main Chat Container -->
    <div class="mx-auto min-h-screen max-w-3xl" id="chat-container">

        <header class="sticky top-0 z-10 flex items-center justify-between border-b border-neutral-800 bg-neutral-900/90 px-4 py-4 backdrop-blur">
            <h1 class="text-xl font-semibold">ChatGPT</h1>

            <button
                id="newChatBtn"
                type="button"
                class="rounded-lg px-3 py-2 text-sm text-neutral-300 transition hover:bg-neutral-800 hover:text-white"
            >
                + New Chat
            </button>
        </header>

        <!-- Chat Messages -->
        <main id="chatContainer" class="px-4 pb-44 pt-6" aria-live="polite">

            <!-- Welcome Message -->
            <div id="welcome" class="mb-8 flex gap-3">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-neutral-700 text-sm font-semibold">
                    AI
                </div>

                <div class="min-w-0 flex-1 pt-1">
                    <p class="mb-2 font-semibold">ChatGPT</p>
                    <p class="leading-7 text-neutral-200">
                        Hello! How can I help you today?
                    </p>
                </div>
            </div>

        </main>

    </div>

    <!-- Bottom Message Input -->
    <footer class="fixed bottom-0 left-0 z-20 w-full bg-gradient-to-t from-neutral-900 via-neutral-900 to-transparent px-3 pb-3 pt-6 sm:px-4">

        <div class="mx-auto max-w-3xl">

            <form
                id="chatForm"
                class="flex items-end gap-2 rounded-3xl border border-neutral-700 bg-neutral-800 px-3 py-2 shadow-xl transition focus-within:border-neutral-500 sm:px-4"
            >

                <!-- Plus Button -->
                <button
                    type="button"
                    id="attachBtn"
                    aria-label="Add attachment"
                    class="mb-1 flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-neutral-200 transition hover:bg-neutral-700"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-6 w-6">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>

                <!-- Message Textarea -->
                <textarea
                    id="message"
                    name="message"
                    rows="1"
                    maxlength="10000"
                    placeholder="Ask anything"
                    aria-label="Type your message"
                    class="max-h-40 min-h-10 min-w-0 flex-1 resize-none overflow-y-auto bg-transparent py-2 text-base leading-6 text-white outline-none placeholder-neutral-400"
                ></textarea>

                <!-- Send Button -->
                <button
                    id="sendBtn"
                    type="submit"
                    aria-label="Send message"
                    disabled
                    class="mb-1 flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white text-black transition hover:bg-neutral-200 active:scale-95 disabled:cursor-not-allowed disabled:bg-neutral-600 disabled:text-neutral-400 disabled:hover:bg-neutral-600 disabled:active:scale-100"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-5 w-5">
                        <path d="M12 19V5"/>
                        <path d="m5 12 7-7 7 7"/>
                    </svg>
                </button>

            </form>

            <p class="mt-2 text-center text-xs text-neutral-500">
                AI can make mistakes. Check important information.
            </p>

        </div>

    </footer>

    <script src="./script.js"></script>

</body>
</html>
